services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_dev_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Máy dev đang có PostgreSQL native chiếm cổng 5432 (xem ghi chú Ngày 2
      # trong docs/1-ke-hoach-chi-tiet.md) nên map ra cổng ngoài 5435.
      - "5435:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: crm-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Dùng config Development (Jwt settings đã có sẵn trong appsettings.Development.json) để
      # còn seed dữ liệu mẫu + Scalar UI khi chạy local qua compose — không phải deploy thật.
      ASPNETCORE_ENVIRONMENT: Development
      # Trong network của compose, Postgres được gọi qua tên service "postgres" + cổng nội bộ
      # 5432 (không phải "localhost:5435" — đó là cổng map ra ngoài host, chỉ dùng khi connect
      # từ máy thật, không dùng được từ bên trong 1 container khác).
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=crm_db;Username=crm_user;Password=crm_dev_password;"
    ports:
      # Map ra cổng ngoài 8090 — máy dev có thể đã chiếm 8080 bởi project khác (tương tự lý do
      # Postgres map ra 5435 thay vì 5432). Bên trong container API vẫn luôn lắng nghe ở 8080.
      - "8090:8080"
    restart: unless-stopped

volumes:
  crm-postgres-data:
    name: crm-postgres-data

services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_dev_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Máy dev đang có PostgreSQL native chiếm cổng 5432 (xem ghi chú Ngày 2
      # trong docs/1-ke-hoach-chi-tiet.md) nên map ra cổng ngoài 5435.
      - "5435:5432"
    volumes:
      - crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Service "api" sẽ bật ở Ngày 21 (Tuần 3), build từ docker/Dockerfile, cùng network với postgres.

volumes:
  crm-postgres-data:
    name: crm-postgres-data
